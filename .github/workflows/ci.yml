name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm tokens --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  production-build:
    name: Production build (no mocks)
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MOCKING: disabled
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    name: E2E + a11y + Lighthouse (mock build)
    needs: quality
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MOCKING: enabled
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build:mock
      - run: pnpm e2e
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7
